# Portable GitLab CI adapter owned by the framework lifecycle and compatibility boundary.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - verify
  - compatibility

variables:
  NPM_CONFIG_IGNORE_PNPMFILE: "true"
  PNPM_CONFIG_IGNORE_PNPMFILE: "true"
  npm_config_ignore_pnpmfile: "true"
  pnpm_config_ignore_pnpmfile: "true"

default:
  image: node:24.21.0-bookworm
  interruptible: true

verify:
  stage: verify
  timeout: 15 minutes
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ripgrep shellcheck && rm -rf
      /var/lib/apt/lists/*
    - |
      case "$(uname -m)" in
        x86_64|amd64) mise_package='@jdxcode/mise-linux-x64'; mise_integrity='sha512-u5i30oDxZYJUh7y2K2bWz4n+p3YTa9y1htcSiJPdBTH9XCMzdNhmhHFEKspBrmxyb9qZju6s/FN0oGl42rLEyg==' ;;
        aarch64|arm64) mise_package='@jdxcode/mise-linux-arm64'; mise_integrity='sha512-SkXAScilkoXsJVCDg/V5A+3koMAqZUDQeCcvsNxUv7AbVgwkAyDYH2fPIWO8K5WewrU3OJCzn90Zf4v2mB6W9w==' ;;
        *) echo "Unsupported GitLab runner architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      mise_stage="$(umask 077 && mktemp -d)"
      npm pack --ignore-scripts --pack-destination "$mise_stage" "${mise_package}@2026.9.5" >/dev/null
      mise_archive="$(node scripts/framework/compatibility-matrix.mjs --verify-mise-archive "$mise_stage" "$mise_integrity")"
      npm install --global "$mise_archive" --ignore-scripts --offline
    - npm install --global pnpm@11.26.0 --ignore-scripts
    - |
      case "$(uname -m)" in
        x86_64|amd64) codex_architecture='x64'; codex_platform_package='@openai/codex-linux-x64'; codex_platform_integrity='sha512-a4FI3A8sGtwGrOqltrPbrS2hajrHQG591EwmRfiRoLMb10VxdBtUGW4gu6IJVYENiYGA7k3P4jlRHEoCZU/s9Q==' ;;
        aarch64|arm64) codex_architecture='arm64'; codex_platform_package='@openai/codex-linux-arm64'; codex_platform_integrity='sha512-KmTCB6ST484zeYlPpKP/K5P/gRaYmt6TihVD+zotoe6O9q0JSBP+FYvCz4A/zZXR7xDOHURTSjHp0sD8wWS0YQ==' ;;
        *) echo "Unsupported stable Codex CI architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      codex_package='@openai/codex'
      codex_version='0.154.0'
      codex_wrapper_integrity='sha512-FV/x1OHXYv/ifjf3mXj9ThTTAWcUZN6cGIRQRhRxkKNOPuImu1WW0c8ev1vUkE9XGH90dEnYG1tBjIkxRikg0w=='
      codex_install_root="$(umask 077 && mktemp -d)"
      codex_stage="$codex_install_root/stage"
      codex_cache="$codex_install_root/cache"
      mkdir -m 700 "$codex_stage" "$codex_cache"
      trap 'rm -rf -- "$codex_install_root"' EXIT
      npm_config_cache="$codex_cache" npm_config_ignore_scripts=true npm cache add "${codex_package}@${codex_version}"
      npm_config_cache="$codex_cache" npm_config_ignore_scripts=true npm cache add "${codex_platform_package}@npm:${codex_package}@${codex_version}-linux-${codex_architecture}"
      npm_config_cache="$codex_cache" npm_config_ignore_scripts=true npm pack --ignore-scripts --pack-destination "$codex_stage" "${codex_package}@${codex_version}" "${codex_package}@${codex_version}-linux-${codex_architecture}" >/dev/null
      node scripts/framework/compatibility-matrix.mjs --verify-codex-archives "$codex_stage" "$codex_wrapper_integrity" "$codex_platform_integrity" >/dev/null
      npm_config_cache="$codex_cache" npm_config_ignore_scripts=true npm install --global "${codex_package}@${codex_version}" --ignore-scripts --offline
      rm -rf -- "$codex_install_root"
      trap - EXIT
    - node scripts/deps/verify-pnpm-execution-policy.mjs
    - pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
  script:
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then pnpm repo:housekeeping -- --check --online; fi
    - pnpm framework:doctor
    - pnpm verify

compatibility-matrix:
  stage: compatibility
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script: []
  script:
    - node scripts/framework/compatibility-matrix.mjs --gitlab-child > compatibility-child.yml
  artifacts:
    expire_in: 1 day
    paths:
      - compatibility-child.yml

compatibility-canaries:
  stage: compatibility
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: compatibility-matrix
      artifacts: true
  trigger:
    include:
      - artifact: compatibility-child.yml
        job: compatibility-matrix
    strategy: depend
