# Owns project-pinned stable tools in runner user storage and disposable source compatibility pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
stages: [verify, compatibility]
variables:
  GIT_DEPTH: "0"
default:
  image: node:24.22.0-bookworm
  interruptible: true
verify:
  stage: verify
  timeout: 20 minutes
  before_script:
    - test -n "${CI_JOB_IMAGE:-}"
    - apt-get update && apt-get install -y --no-install-recommends ripgrep shellcheck python3
    - env -u NODE_OPTIONS -u NODE_PATH node scripts/deps/maintain-toolchain.mjs --locked
  script:
    - if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then bash -p scripts/setup/run-project.sh pnpm
      repo:housekeeping -- --check --online; fi
    - bash -p scripts/setup/run-project.sh pnpm framework:doctor
    - bash -p scripts/setup/run-project.sh pnpm verify
compatibility-matrix:
  stage: compatibility
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script: []
  script:
    - env -u NODE_OPTIONS -u NODE_PATH node scripts/framework/compatibility-matrix.mjs
      --gitlab-child > compatibility-child.yml
  artifacts:
    expire_in: 1 day
    paths: [compatibility-child.yml]
compatibility-canaries:
  stage: compatibility
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: compatibility-matrix
      artifacts: true
  trigger:
    include:
      - artifact: compatibility-child.yml
        job: compatibility-matrix
    strategy: depend
