# Owns source verification and disposable compatibility experiments with project-local tools.
name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision the disposable container's read-only bootstrap utilities
        run: apt-get update && apt-get install -y --no-install-recommends ripgrep shellcheck
      - name: Reproduce repository-local tools and locked dependencies
        run: node scripts/deps/maintain-toolchain.mjs --locked
      - name: Check scheduled repository housekeeping and freshness
        if: github.event_name == 'schedule'
        run: bash scripts/setup/run-project.sh pnpm repo:housekeeping -- --check --online
      - name: Validate framework and detected platform contracts
        run: bash scripts/setup/run-project.sh pnpm framework:doctor
      - name: Run the complete deterministic verification plan
        run: bash scripts/setup/run-project.sh pnpm verify
  compatibility-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: matrix
        run:
          echo "matrix=$(node scripts/framework/compatibility-matrix.mjs --github-matrix)" >>
          "$GITHUB_OUTPUT"
  compatibility-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: compatibility-matrix
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}
    name: compatibility / ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision the disposable container's read-only bootstrap utilities
        run: apt-get update && apt-get install -y --no-install-recommends ripgrep shellcheck
      - name: Prepare the explicitly selected disposable toolchain experiment
        env:
          COMPATIBILITY_TRACK: ${{ matrix.id }}
        run:
          node scripts/framework/prepare-compatibility-track.mjs --disposable-checkout
          "$COMPATIBILITY_TRACK"
      - name: Verify the actual selected runtime
        env:
          COMPATIBILITY_TRACK: ${{ matrix.id }}
        run:
          bash scripts/setup/run-project.sh node scripts/framework/compatibility-matrix.mjs
          --check-track "$COMPATIBILITY_TRACK"
      - run: bash scripts/setup/run-project.sh pnpm verify
