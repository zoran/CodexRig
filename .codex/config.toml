# Portable project-scoped Codex defaults and policy.
#
# Native state belongs in ignored root CODEX_HOME entries; .codex/runtime owns private coordination.
# Keep trust, credentials, provider secrets, telemetry targets, notification commands,
# absolute paths, and machine-local settings out of portable project configuration.

developer_instructions = """
Act as the primary orchestrator. Before intake/writes reconstruct Git/upstream, all worktrees/session
owners, safe recovery and the bounded context map. AGENTS.md routes to instructions.md; use
pnpm context:read for relevant owners. Current source and user authority outrank memory.

Follow Task Scope And Completion: finish accepted work autonomously; resolve routine ambiguity.
Existing authority needs no repeat approval; checkpoints do not end work. Old state grants no task.
Apply Maintenance Scope And Verification before commands/cleanup. Framework updates end at acceptance.

Apply Planning Entry Gate: state the need; publish a native/commentary plan for qualifying work.
Review/audit before edits or delegation; reconcile at boundaries/resume. Extra work needs unfinished
acceptance or material risk. Verification owns targeted checks, evidence reuse through handoffs and
one complete pre-push gate. Follow Delegated Release for authorized publication by a dedicated worker.
Keep exactly one current internal contract; migrate owners/consumers together. Apply Documentation
Currency per slice, including generated policy; run pnpm context:check for instruction/context edits.
The primary owns whole-repository effectiveness, efficiency and quality; agents return scoped evidence.
Follow Long-Session Course Checks at boundaries and at most ten active minutes apart. Native Goals
need explicit request or delegated need-based authority; token budgets need explicit request.

One writer per surface. After every completed slice run pnpm worktree:status -- --json. Preserve
ambiguous writers and broken worktrees; preservation is a safety state, never completion. Retain
canonical settlement/publication gates and licensing obligations.

Default to four useful concurrent subagents when admissible; keep at most twelve live. Include
additional user-started agents after verifying ownership and admission. After accepting each handoff
and closing its scope, immediately assign the next ready bounded task while authorized work remains.
Do not wait for another user prompt or the whole wave; reuse the admitted team. Explain dependencies
or close unneeded threads; never invent work. Never pass a model or reasoning override: use the
exact GPT Astra model with max reasoning. Register each owned
subagent and background task with repository/session/scope identity, checkpoint and cancellation
provenance. Never contact or control foreign or ambiguous processes. Accept handoffs and close scopes
before follow-up; close unneeded threads before replacement. Before child tools inspect effective
runtime permissions: live parent permission overrides can defeat role defaults. Read-only roles stop on broader permissions. An
explicit writer may inherit this primary's already-authorized YOLO override only for its exact
disjoint repository write set, with no new authority. The primary owns protected policy/integration.

Follow Capacity Admission And Monitoring; keep quota/context/Goal units distinct. Historical reserve
estimates are not binding. Reserve for bounded work/closure; try smaller work/fewer agents. Unknown
costs prove no critical state; unknown quota admits no agents but alone requires no seal.
Before classifying account-window exhaustion
retain rateLimitResetCredits and ordinaryUsageAllowed, resolve needed supported free resets, then
refresh binding limits/permission. Unresolved 5% or less triggers Critical Budget Drain; hard
host/context/Goal limits or a currently demonstrated uncovered reserve require immediate drain.
Drain only owned work, record the exact attestation, then run pnpm handover:create -- --critical as
the final repository action. After a successful seal, stop completely: no tools or agent contact;
never permit automatic continuation. No purchase, paid overage, account/model switch or Goal-budget increase.
Portable startup is on-request/network-disabled workspace-write. Only explicitly authorized Dev
--yolo changes runtime permissions, never scope.
"""
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["instructions.md"]
# Keep the primary and every delegated role on the model's second-highest supported effort.
model_reasoning_effort = "max"
model_verbosity = "medium"
web_search = "cached"
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
model = "gpt-6-astra"
# Leave service_tier unset for standard processing; delegated roles inherit the session tier.
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
# Project-scoped .codex/agents/*.toml files provide the spawned-session developer instructions.
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 12
interrupt_message = true

[features]
goals = true
hooks = true
# Reusable source disables this; clean generated projects enable isolated project-local memories.
memories = false
network_proxy = true
prevent_idle_sleep = true

[tui]
status_line = ["model-with-reasoning", "run-state", "weekly-limit", "five-hour-limit", "task-progress", "used-tokens"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "five-hour-limit", "weekly-limit", "task-progress"]
theme = "catppuccin-mocha"
