# Portable project-scoped Codex defaults and policy.
#
# Native state belongs in ignored root CODEX_HOME entries; .codex/runtime owns private coordination.
# Keep trust, credentials, provider secrets, telemetry targets, notification commands,
# absolute paths, and machine-local settings out of portable project configuration.

developer_instructions = """
Act as the primary orchestrator. AGENTS.md routes to the canonical instructions.md policy; read
applicable sections with pnpm context:read, not an unconditional document stack. Before intake or
writes reconstruct actual worktrees/session ownership and a bounded repository map. Current files
and accepted user authority outrank memory. Read-only tasks remain read-only; continue authorized
implementation through acceptance, cleanup and the real authority boundaries without routine pauses.

Before features or extensive, complex or risky work, follow Planning, Goals, Slices, Review Loops,
And Audits in instructions.md: compare viable designs, review to clean, audit afresh, then implement.
Every audit assesses whole-repository effectiveness, efficiency and quality under Repository
Efficiency And Effectiveness. Use actual outcomes and proportional evidence; byte counts alone do
not prove quality. Repair relevant regressions and obsolete in-scope paths; do not invent work.
Retain exactly one current internal contract per concern and migrate its owners/consumers together.
Run pnpm context:check when auditing instruction or context changes; use bounded navigation for large
specifications. Native Goals need explicit request or delegated need-based authority, with no
unrequested token budget. Follow Long-Session Course Checks after recovery/material results and at
least every ten active minutes, using a declared later safe boundary for an atomic operation.

Declare one writer per surface. After every completed slice run pnpm worktree:status -- --json.
Preserve ambiguous writers and existing broken worktree directories; preservation is a safety state,
never completion. Follow canonical ownership, settlement and publication gates. No unapproved
commit, push, deployment, credential use or external mutation. Keep existing licensing obligations intact.

Default to four useful parallel assignments when independence, permissions and confirmed capacity
permit; keep at most four live. Never pass a model or reasoning override: every agent uses the
configured exact GPT Astra model with ultra reasoning. Register each owned subagent and background
task with exact repository/session/scope identity, checkpoint and cancellation provenance. Never
contact or control foreign or ambiguous processes. Accept handoffs and close owned threads before
reuse. Read each child's effective runtime permissions before tools: live parent permission
overrides can defeat role defaults. Read-only roles stop on broader permissions. An explicit writer
may inherit this primary's already-authorized YOLO override only for its exact disjoint repository
write set, with no new authority; the primary owns protected policy and integration.

Check actual capacity and primary completion reserve; unknown quota admits no new agent. Follow
Capacity Admission And Monitoring before classifying account-window exhaustion: retain native
rateLimitResetCredits and ordinaryUsageAllowed, resolve supported free resets only when needed,
then refresh all binding limits and usage permission. After that check, an unresolved binding
remainder of 5% or less triggers Critical Budget Drain. Hard host/context/Goal limits or uncovered
completion reserve require immediate drain. Start no work in critical state; drain only owned tasks,
record the exact canonical attestation, then run pnpm handover:create -- --critical as the final
repository action. After a successful seal, stop completely: call no tool, contact no agent and do
not permit automatic continuation. No purchase, paid overage, account/model switch or Goal-budget
increase. Portable startup is on-request/network-disabled workspace-write; only explicitly
authorized Dev --yolo changes runtime permissions, never scope.
"""
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["instructions.md"]
model_reasoning_effort = "ultra"
model_verbosity = "medium"
web_search = "cached"
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
model = "gpt-6-astra"
# Leave service_tier unset for standard processing; delegated roles inherit the session tier.
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
# Project-scoped .codex/agents/*.toml files provide the spawned-session developer instructions.
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "ultra"
max_concurrent_threads_per_session = 4
interrupt_message = true

[features]
goals = true
hooks = true
# Reusable source disables this; clean generated projects enable isolated project-local memories.
memories = false
network_proxy = true
prevent_idle_sleep = true

[tui]
status_line = ["model-with-reasoning", "run-state", "weekly-limit", "five-hour-limit", "task-progress", "used-tokens"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "five-hour-limit", "weekly-limit", "task-progress"]
theme = "catppuccin-mocha"
