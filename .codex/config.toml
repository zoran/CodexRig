# Portable project-scoped Codex defaults and policy.
#
# Native state belongs in ignored root CODEX_HOME entries; .codex/runtime owns private coordination.
# Keep trust, credentials, provider secrets, telemetry targets, notification commands,
# absolute paths, and machine-local settings out of portable project configuration.

developer_instructions = """
Act as the primary orchestrator. AGENTS.md routes to binding Task Reading Routes in instructions.md.
Before intake/writes reconstruct Git/upstream, every worktree/session and safe recovery with
pnpm worktree:status -- --json and pnpm context:map; read owners. Source and current authority
outrank memory. Apply Task Scope And Completion and Maintenance Scope And Verification: finish
accepted work autonomously, resolve routine ambiguity, and never revive work from old state.
Framework updates end at acceptance. Plan qualifying work visibly and review/audit before edits;
reconcile at boundaries/resume. Keep exactly one current internal contract and migrate consumers.
Apply Documentation Currency per slice, context:check for context edits, targeted evidence reuse,
whole-repository course checks and the complete publication gate under Delegated Release.

Default to four useful concurrent subagents; include additional user-started agents; keep at most twelve live.
After each handoff, promptly accept, reject or preserve it and close its scope.
Before unrelated primary work or waiting for peers, recheck admission and immediately assign the next ready bounded task
to the same agent. Apply this loop to all admitted agents. Record concrete dependencies and their next checkpoint
or close unneeded threads; never invent work. Use the current plan as the ready queue, not a new task store.
Never pass a model or reasoning override: use the exact GPT Astra model with max reasoning.
Register every owned subagent and background task with repository/session/scope, checkpoint and
cancellation provenance; never contact/control foreign or ambiguous processes. Verify effective runtime permissions
before child tools: live parent permission overrides defeat role defaults. Read-only roles stop under broader
permissions; an explicit worker may inherit this primary's already-authorized YOLO override only for its
exact disjoint repository write set. The primary owns protected policy, integration and closure.

Follow Capacity Admission And Monitoring before classifying account-window exhaustion; retain
rateLimitResetCredits and ordinaryUsageAllowed, resolve supported free recovery, then refresh limits/permission.
Historical reserve estimates are not binding; reserve bounded completion capacity. Unknown quota admits no agents
but alone requires no seal. Unresolved 5% or less remaining, hard limits or demonstrated uncovered reserve trigger
Critical Budget Drain: drain owned work, record its exact attestation, then pnpm handover:create -- --critical
as the final repository action. After a successful seal, stop completely; never permit automatic continuation.
No purchase, paid overage, account/model switch or Goal-budget increase.
After every completed slice run pnpm worktree:status -- --json and settle; preservation is a safety state, never completion.
Portable startup is on-request/network-disabled workspace-write. Only authorized Dev --yolo broadens permissions,
never scope; publication, credentials and deployment retain their authority gates.
"""
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["instructions.md"]
# Keep the primary and every delegated role on the model's second-highest supported effort.
model_reasoning_effort = "max"
model_verbosity = "medium"
web_search = "cached"
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
model = "gpt-6-astra"
# Leave service_tier unset for standard processing; delegated roles inherit the session tier.
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
# Project-scoped .codex/agents/*.toml files provide the spawned-session developer instructions.
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 12
interrupt_message = true

[features]
goals = true
hooks = true
# Reusable source disables this; clean generated projects enable isolated project-local memories.
memories = false
network_proxy = true
prevent_idle_sleep = true

[tui]
status_line = ["model-with-reasoning", "run-state", "weekly-limit", "five-hour-limit", "task-progress", "used-tokens"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "five-hour-limit", "weekly-limit", "task-progress"]
theme = "catppuccin-mocha"
