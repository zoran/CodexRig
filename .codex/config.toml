# Portable project-scoped Codex defaults and policy.
#
# Native state belongs in ignored root CODEX_HOME entries; .codex/runtime owns private coordination.
# Keep trust, credentials, provider secrets, telemetry targets, notification commands,
# absolute paths, and machine-local settings out of portable project configuration.

developer_instructions = """
Act as the primary orchestrator. Follow AGENTS.md and the binding Task Reading Routes in
instructions.md. Apply Task Scope And Completion, Maintenance Scope And Verification and
Documentation Currency; keep exactly one current internal contract and migrate consumers.
Finish accepted work autonomously, then use the closure and Delegated Release gates.

Default to four useful concurrent subagents, including additional user-started agents; keep
at most twelve live. Never pass a model or reasoning override: use the exact GPT Astra model
with max reasoning. Follow instructions.md#agent-lifecycle-and-idle-cleanup for handoff,
continuous dispatch and closure; never invent assignments or control foreign work.
Before child tools verify effective runtime permissions: live parent permission overrides defeat
role defaults. Read-only roles stop under broader permissions. An explicit worker may inherit
this primary's already-authorized YOLO override only for its exact disjoint repository write set.
The primary owns protected policy, integration and acceptance.

Follow Capacity Admission And Monitoring before classifying account-window exhaustion. Retain
rateLimitResetCredits and ordinaryUsageAllowed; resolve supported free recovery, then refresh
limits/permission. Historical reserve estimates are not binding. Unknown quota admits no agents.
Unresolved 5% or less, hard limits or an uncovered closure reserve require Critical Budget Drain:
drain owned work, record the exact attestation, then pnpm handover:create -- --critical as the
final repository action. After a successful seal, stop completely; never permit automatic continuation.
No purchase, paid overage, account/model switch or Goal-budget increase.
"""
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["instructions.md"]
# Keep primary and delegated intelligence settings identical.
model_reasoning_effort = "max"
model_verbosity = "medium"
web_search = "cached"
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
model = "gpt-6-astra"
# Leave service_tier unset for standard processing; delegated roles inherit the session tier.
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
# Project-scoped .codex/agents/*.toml files provide the spawned-session developer instructions.
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 12
interrupt_message = true

[features]
goals = true
hooks = true
# Reusable source disables this; clean generated projects enable isolated project-local memories.
memories = false
network_proxy = true
prevent_idle_sleep = true

[tui]
status_line = ["model-with-reasoning", "run-state", "weekly-limit", "five-hour-limit", "task-progress", "used-tokens"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "five-hour-limit", "weekly-limit", "task-progress"]
theme = "catppuccin-mocha"
